
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
   <header class="site-header">

    <div class="container-fluid px-0">

        
        <div class="row align-items-center g-2 etsy-top">

            <!-- Etsy Logo -->
            <div class="col-auto">
                <h1 class="logo">Etsy</h1>
            </div>

            <!-- Categories -->
            <div class="col-auto categories ms-auto ms-md-0">
                <span class="menu-icon">☰</span>
                <span>Categories</span>
            </div>

            
            <div class="col-12 col-md etsy-search-col order-3 order-md-0">

                <div class="search-bar">

                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search for anything"
                    >

                    <button type="button" aria-label="Search">
                        🔍
                    </button>

                </div>

            </div>

            <!-- User Actions -->
            <div class="col-auto user-actions order-2 order-md-0">

                <button type="button">Sign in</button>

                <a href="#favorites"
                   aria-label="Favorites"
                   class="icon-link">♥</a>

                
                <a href="cart.html" aria-label="Shopping cart" class="icon-link cart-link">
                    <span class="cart-icon">🧺</span>
                    <span id="cartCount">0</span>
                </a>


            </div>

        </div>

        <!-- Bootstrap Navbar -->
        <nav class="navbar navbar-expand p-0 etsy-category-nav">

            <div class="container-fluid px-0">

                <div class="navbar-nav flex-row flex-wrap justify-content-center w-100">

                    <a class="nav-link" href="#ART_COLLECTION">
                        ART COLLECTION
                    </a>

                    <a class="nav-link" href="#JEWELARY">
                        JEWELARY
                    </a>

                    <a class="nav-link" href="#BOOKS">
                        BOOKS
                    </a>

                </div>

            </div>

        </nav>

    </div>

</header>


   
    
<main class="cart-page">

    <h2 class="cart-heading">Your basket</h2>

    <div class="cart-layout">

        <!-- Left side: Cart products -->
        <section class="cart-products">

            <div id="cartItems"></div>

        <a href="index.html" class="continue-shopping">
            Continue shopping
        </a>

        </section>


        <!-- Right side: Order summary -->
        <aside class="cart-summary">

            <div class="summary-row">
                <span>Item(s) total</span>

                <span>
                    USD <span id="cartTotal">0.00</span>
                </span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <span class="free-delivery">FREE</span>
            </div>

            <hr>

            <div class="summary-row summary-total">
                <span>Total</span>

                <span>
                    USD <span id="cartTotalCopy">0.00</span>
                </span>
            </div>

            <button type="button" id="checkoutBtn">
                Proceed to checkout
            </button>

        </aside>

    </div>

<!-- Checkout Form -->
<form id="checkoutForm" class="checkout-form" hidden novalidate>

    <h2>Checkout</h2>

    <!-- Name -->
    <div class="checkout-field">

        <label for="customerName">Full Name</label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter your full name"
        >

        <small class="form-error" id="nameError"></small>

    </div>


    <!-- Email -->
    <div class="checkout-field">

        <label for="customerEmail">Email Address</label>

        <input
            type="text"
            id="customerEmail"
            placeholder="example@gmail.com"
        >

        <small class="form-error" id="emailError"></small>

    </div>


    <!-- Phone -->
    <div class="checkout-field">

        <label for="customerPhone">Phone Number</label>

        <input
            type="text"
            id="customerPhone"
            placeholder="+923001234567"
        >

        <small class="form-error" id="phoneError"></small>

    </div>


    <!-- Address -->
    <div class="checkout-field">

        <label for="customerAddress">Delivery Address</label>

        <textarea
            id="customerAddress"
            placeholder="Enter your complete address"
            rows="4"
        ></textarea>

        <small class="form-error" id="addressError"></small>

    </div>


    <button type="submit" class="place-order-btn">
        Place Order
    </button>

    <p id="checkoutMessage"></p>

</form>

</main>
<script src="script.js"></script>
</body>
</html>
