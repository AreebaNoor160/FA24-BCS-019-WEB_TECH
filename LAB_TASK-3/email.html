
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSpace - Email Validation</title>

   
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #F5EDE4;
        color: #49372E;

        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        padding: 20px 5%;
        background-color: #E5D2BF;
        border-bottom: 1px solid #D5BDA8;
    }

    header a {
        text-decoration: none;
        color: #49372E;
        font-size: 24px;
        font-weight: bold;
    }

    main {
        max-width: 500px;
        margin: 60px auto;
        padding: 30px;
        background-color: #FFFFFF;
        border: 1px solid #E5D2BF;
        border-radius: 5px;
    }

    h1 {
        margin-bottom: 15px;
        text-align: center;
    }

    p {
        color: #806B5C;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    #email {
        width: 100%;
        padding: 12px;
        border: 1px solid #D5BDA8;
        border-radius: 5px;
        font-size: 16px;
    }

    #message {
        margin-top: 15px;
        font-size: 15px;
        font-weight: bold;
    }

    .valid {
        color: green;
    }

    .invalid {
        color: red;
    }

    footer {
        text-align: center;
        padding: 20px;
        background-color: #E5D2BF;
        border-top: 1px solid #D5BDA8;

        margin-top: auto;
    }
</style>

</head>

<body>

    <header>
        <a href="../index.html">ShopSpace</a>
    </header>

    <main>
        <h1>Email Validation</h1>

        <p>Enter your email address to check its validity.</p>

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
        >

        <p id="message"></p>
    </main>

    <footer>
        <p>ShopSpace - JavaScript Practice</p>
    </footer>

    <script src="email.js"></script>

</body>
</html>
